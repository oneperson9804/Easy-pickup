name: Verify Easy pickup
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
jobs:
  android-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug --target-platform android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-x64
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
  ios-simulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Test iOS simulator startup and local records
        timeout-minutes: 25
        run: bash scripts/test-ios-simulator.sh
      - name: Verify embedded WidgetKit and share extensions
        run: |
          test -d build/ios/iphonesimulator/Runner.app/PlugIns/PickupWidget.appex
          test -d build/ios/iphonesimulator/Runner.app/PlugIns/ShareExtension.appex
      - name: Inspect iOS dependency linkage after failure
        if: failure()
        run: |
          cat ios/Runner.xcworkspace/contents.xcworkspacedata
          cat ios/Flutter/Debug.xcconfig
          find build/ios -type d -name Pods_Runner.framework -print || true
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -showBuildSettings 2>&1 | grep -E 'FRAMEWORK_SEARCH_PATHS|PODS_CONFIGURATION_BUILD_DIR|BUILT_PRODUCTS_DIR|error:' || true
